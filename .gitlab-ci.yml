image: docker:29.0.1-cli

services:
  - docker:dind

stages:
  - build
  - manifest

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  FF_NETWORK_PER_BUILD: 1
  # Change this to make a different distro the default '24.11' tag
  DEFAULT_DISTRO: bookworm

before_script:
  - echo "$GITLAB_REGISTRY_TOKEN" | docker login -u "$GITLAB_REGISTRY_USER" --password-stdin $CI_REGISTRY
  - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin

# AMD64 builds - push to GitLab registry
.build-amd64:
  stage: build
  tags: [saas-linux-medium-amd64]
  script:
    - docker build --platform linux/amd64
      --tag $CI_REGISTRY_IMAGE:${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}-amd64
      --file dists/${CI_JOB_NAME}/Dockerfile
      --push .
  only:
    - 24.11@koha-community/koha-testing-docker

# ARM64 builds - push to GitLab registry
.build-arm64:
  stage: build
  tags: [saas-linux-medium-arm64]
  script:
    - docker build --platform linux/arm64/v8
      --tag $CI_REGISTRY_IMAGE:${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}-arm64
      --file dists/${CI_JOB_NAME}/Dockerfile
      --push .
  only:
    - 24.11@koha-community/koha-testing-docker

# Manifest creation - pull, push temp tags, create manifest, cleanup
.create-manifest:
  stage: manifest
  image: docker:latest
  services:
    - docker:dind
  script:
    # Pull from GitLab
    - docker pull $CI_REGISTRY_IMAGE:${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}-amd64
    - docker pull $CI_REGISTRY_IMAGE:${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}-arm64

    # Retag for Docker Hub
    - docker tag $CI_REGISTRY_IMAGE:${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}-amd64 koha/koha-testing:temp-${CI_JOB_NAME}-amd64-${CI_PIPELINE_ID}
    - docker tag $CI_REGISTRY_IMAGE:${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}-arm64 koha/koha-testing:temp-${CI_JOB_NAME}-arm64-${CI_PIPELINE_ID}
    
    # Push to Docker Hub
    - docker push koha/koha-testing:temp-${CI_JOB_NAME}-amd64-${CI_PIPELINE_ID}
    - docker push koha/koha-testing:temp-${CI_JOB_NAME}-arm64-${CI_PIPELINE_ID}
    
    # Create manifest
    - docker manifest create koha/koha-testing:${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}
        koha/koha-testing:temp-${CI_JOB_NAME}-amd64-${CI_PIPELINE_ID}
        koha/koha-testing:temp-${CI_JOB_NAME}-arm64-${CI_PIPELINE_ID}
    - docker manifest push koha/koha-testing:${CI_COMMIT_REF_NAME}-${CI_JOB_NAME}
    
    # Create branch alias if this is the default distro (e.g., '24.11' for 24.11-bookworm)
    - |
      if [ "${CI_JOB_NAME}" = "${DEFAULT_DISTRO}" ]; then
        docker manifest create koha/koha-testing:${CI_COMMIT_REF_NAME} \
          koha/koha-testing:temp-${CI_JOB_NAME}-amd64-${CI_PIPELINE_ID} \
          koha/koha-testing:temp-${CI_JOB_NAME}-arm64-${CI_PIPELINE_ID}
        docker manifest push koha/koha-testing:${CI_COMMIT_REF_NAME}
      fi

    # Clean up temp tags
    - docker run --rm lumir/remove-dockerhub-tag
        --user $REGISTRY_USER --password $REGISTRY_PASSWORD
        koha/koha-testing:temp-${CI_JOB_NAME}-amd64-${CI_PIPELINE_ID} || true
    - docker run --rm lumir/remove-dockerhub-tag
        --user $REGISTRY_USER --password $REGISTRY_PASSWORD
        koha/koha-testing:temp-${CI_JOB_NAME}-arm64-${CI_PIPELINE_ID} || true
  only:
    - 24.11@koha-community/koha-testing-docker

trixie-amd64:
  extends: .build-amd64
  variables:
    CI_JOB_NAME: trixie

trixie-arm64:
