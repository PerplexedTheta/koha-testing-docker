image: docker:29.0.1-cli

services:
  - docker:dind

stages:
  - build
  - manifest

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  FF_NETWORK_PER_BUILD: 1

before_script:
  - echo "$GITLAB_REGISTRY_TOKEN" | docker login -u "$GITLAB_REGISTRY_USER" --password-stdin $CI_REGISTRY
  - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin

# AMD64 builds - push to GitLab registry
.build-amd64:
  stage: build
  tags: [saas-linux-medium-amd64]
  script:
    - docker build --platform linux/amd64 
      --tag $CI_REGISTRY_IMAGE:${CI_JOB_NAME}-amd64
      --file dists/${CI_JOB_NAME}/Dockerfile
      --push .
  only:
    - main@koha-community/koha-testing-docker

# ARM64 builds - push to GitLab registry
.build-arm64:
  stage: build
  tags: [saas-linux-medium-arm64]
  script:
    - docker build --platform linux/arm64/v8
      --tag $CI_REGISTRY_IMAGE:${CI_JOB_NAME}-arm64
      --file dists/${CI_JOB_NAME}/Dockerfile
      --push .
  only:
    - main@koha-community/koha-testing-docker

# Manifest creation - pull from GitLab, retag locally, create manifest on Docker Hub
.create-manifest:
  stage: manifest
  tags: [saas-linux-medium-amd64]
  before_script:
    - echo "$GITLAB_REGISTRY_TOKEN" | docker login -u "$GITLAB_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin
  script:
    # Pull images from GitLab registry
    - docker pull $CI_REGISTRY_IMAGE:${CI_JOB_NAME}-amd64
    - docker pull $CI_REGISTRY_IMAGE:${CI_JOB_NAME}-arm64
    # Retag for Docker Hub
    - docker tag $CI_REGISTRY_IMAGE:${CI_JOB_NAME}-amd64 koha/koha-testing:${CI_JOB_NAME}-amd64-${CI_PIPELINE_ID}
    - docker tag $CI_REGISTRY_IMAGE:${CI_JOB_NAME}-arm64 koha/koha-testing:${CI_JOB_NAME}-arm64-${CI_PIPELINE_ID}
    # Push temporary tags
    - docker push koha/koha-testing:${CI_JOB_NAME}-amd64-${CI_PIPELINE_ID}
    - docker push koha/koha-testing:${CI_JOB_NAME}-arm64-${CI_PIPELINE_ID}
    # Create manifest using Docker Hub images
    - docker manifest create koha/koha-testing:main-${CI_JOB_NAME}
      koha/koha-testing:${CI_JOB_NAME}-amd64-${CI_PIPELINE_ID}
      koha/koha-testing:${CI_JOB_NAME}-arm64-${CI_PIPELINE_ID}
    - docker manifest push koha/koha-testing:main-${CI_JOB_NAME}
  only:
    - main@koha-community/koha-testing-docker

trixie-amd64:
  extends: .build-amd64
  variables:
    CI_JOB_NAME: trixie

trixie-arm64:
  extends: .build-arm64
  variables:
    CI_JOB_NAME: trixie

trixie-manifest:
  extends: .create-manifest
  variables:
    CI_JOB_NAME: trixie
  needs:
    - trixie-amd64
    - trixie-arm64

